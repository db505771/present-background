<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Present Background</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
body {
    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(255, 95, 105, .35),
            transparent 65%
        ),
        radial-gradient(
            ellipse at 100% 100%,
            rgba(55, 0, 8, .4),
            transparent 60%
        ),
        linear-gradient(
            145deg,
            #A90019,
            #D3132D 48%,
            #850013
        );
}
</style>
</head>
