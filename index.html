<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Present Background</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
    background:
        radial-gradient(ellipse at 15% 10%, rgba(255,100,100,.28), transparent 45%),
        radial-gradient(ellipse at 90% 85%, rgba(100,0,0,.5), transparent 50%),
        linear-gradient(145deg, #A60017, #D4142E 48%, #76000F);
    position: relative;
}
/* Soft lighting */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 45%,
        rgba(255,255,255,.09),
        transparent 65%);
    pointer-events: none;
}
/* Decorative ribbons */
.ribbon {
    position: absolute;
    background: linear-gradient(
        90deg,
        #E9B85F,
        #FFE6A5,
        #C58A36
    );
    opacity: .9;
    box-shadow: 0 0 20px rgba(255,210,120,.15);
}
.ribbon.vertical {
    width: 35px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
}
.ribbon.horizontal {
    height: 30px;
    width: 100%;
    top: 48%;
}
/* Decorative present */
.gift {
    position: absolute;
    width: 150px;
    height: 130px;
    border-radius: 15px;
    background: linear-gradient(
        145deg,
        #F04454,
        #A90020
    );
    box-shadow:
        0 20px 60px rgba(0,0,0,.25),
        inset 0 2px 8px rgba(255,255,255,.2);
    opacity: .25;
}
.gift.one {
    top: 12%;
    left: -65px;
    transform: rotate(-18deg) scale(1.3);
}
.gift.two {
    bottom: 12%;
    right: -55px;
    transform: rotate(20deg) scale(1.5);
}
.gift.three {
    top: 65%;
    left: 12%;
    transform: rotate(12deg) scale(.65);
}
/* Floating festive sparkles */
.sparkle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #FFE6A5;
    box-shadow: 0 0 12px #FFE6A5;
    opacity: .65;
}
.s1 { top: 15%; left: 25%; }
.s2 { top: 35%; right: 15%; }
.s3 { top: 70%; left: 35%; }
.s4 { top: 85%; right: 30%; }
.s5 { top: 50%; left: 8%; }
/* Glass overlay */
.glass {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        135deg,
        rgba(255,255,255,.06),
        transparent 40%,
        rgba(0,0,0,.08)
    );
    pointer-events: none;
}
</style>
</head>
<body>
<div class="gift one"></div>
<div class="gift two"></div>
<div class="gift three"></div>
<div class="ribbon vertical"></div>
<div class="ribbon horizontal"></div>
<div class="sparkle s1"></div>
<div class="sparkle s2"></div>
<div class="sparkle s3"></div>
<div class="sparkle s4"></div>
<div class="sparkle s5"></div>
<div class="glass"></div>
</body>
</html>
